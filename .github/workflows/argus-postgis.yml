name: ARGUS PostGIS Gate

on:
  pull_request:
    branches: ['argus/main']
    paths:
      - 'db/argus_world/**'
      - 'src/argus/memory/**'
      - 'src/argus/providers/**'
      - 'src/argus/externalProviderIngest*'
      - '.github/workflows/argus-postgis.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus-postgis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    name: Clean PostGIS migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.14.0', '26']

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: argus
      PGPASSWORD: argus
      PGDATABASE: argus_test

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Apply migration on clean database
        run: psql -v ON_ERROR_STOP=1 -f db/argus_world/001_world_memory.sql

      - name: Verify geometry time provenance and supersession
        run: psql -v ON_ERROR_STOP=1 -f db/argus_world/001_world_memory_test.sql

      - name: Reset ARGUS schema
        run: psql -v ON_ERROR_STOP=1 -c "DROP SCHEMA argus_world CASCADE;"

      - name: Reapply migration after reset
        run: psql -v ON_ERROR_STOP=1 -f db/argus_world/001_world_memory.sql

      - name: Re-run migration gate
        run: psql -v ON_ERROR_STOP=1 -f db/argus_world/001_world_memory_test.sql

      - name: Use Node.js for repository integration
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install pinned PostgreSQL test driver
        run: npm install --no-save --package-lock=false pg@8.16.3

      - name: Run Postgres repository contract suite
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:5432/argus_test
        run: node --test src/argus/memory/postgresRepository.test.mjs

      - name: Run temporal and spatial World Memory query gate
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:5432/argus_test
        run: node --test src/argus/memory/worldMemoryQuery.postgres.test.mjs

      - name: Run external provider contract suite
        run: node --test src/argus/externalProviderIngest.test.mjs

      - name: Run live USGS to PostGIS E2E gate
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:5432/argus_test
        run: node --test src/argus/externalProviderIngest.postgres.test.mjs

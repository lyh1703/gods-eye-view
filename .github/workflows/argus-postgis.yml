name: ARGUS PostGIS Gate

on:
  pull_request:
    branches: ['argus/main']
    paths:
      - 'db/argus_world/**'
      - 'src/argus/memory/**'
      - 'src/argus/providers/**'
      - 'src/argus/celestrak*'
      - 'server/providers/space/celestrak*'
      - 'src/data/celestrakPolicy.js'
      - 'src/layers/satellites/source*'
      - 'src/argus/externalProviderIngest*'
      - 'src/argus/nexusVerifiedQuery*'
      - 'src/argus/multiSourceFusion*'
      - 'src/layers/earthquakes/worldMemorySource*'
      - 'src/layers/earthquakes/index.js'
      - '.github/workflows/argus-postgis.yml'
  push:
    branches: ['argus/main']
    paths:
      - 'db/argus_world/**'
      - 'src/argus/memory/**'
      - 'src/argus/providers/**'
      - 'src/argus/celestrak*'
      - 'server/providers/space/celestrak*'
      - 'src/data/celestrakPolicy.js'
      - 'src/layers/satellites/source*'
      - 'src/argus/externalProviderIngest*'
      - 'src/argus/nexusVerifiedQuery*'
      - 'src/argus/multiSourceFusion*'
      - 'src/layers/earthquakes/worldMemorySource*'
      - 'src/layers/earthquakes/index.js'
      - '.github/workflows/argus-postgis.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus-postgis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    name: Clean PostGIS migration
    runs-on: [self-hosted, linux, x64, maker-team]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.14.0', '26']

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGUSER: argus
      PGPASSWORD: argus
      PGDATABASE: argus_test

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve PostGIS service container
        shell: bash
        run: |
          set -euo pipefail
          cid="${{ job.services.postgis.id }}"
          if [ -z "$cid" ] || ! docker inspect "$cid" >/dev/null 2>&1; then
            echo "::error::ARGUS PostGIS service container identity is missing"
            exit 1
          fi
          actual_image="$(docker inspect --format '{{.Config.Image}}' "$cid")"
          test "$actual_image" = "postgis/postgis:16-3.4" || { echo "::error::unexpected PostGIS service image"; exit 1; }
          echo "ARGUS_POSTGIS_CID=$cid" >> "$GITHUB_ENV"
          # The service port exists only inside a running job. GitHub rejects
          # job.services in jobs.<job_id>.env before it can schedule the job.
          echo "PGPORT=${{ job.services.postgis.ports[5432] }}" >> "$GITHUB_ENV"
          docker exec "$cid" psql --version

      - name: MT74 simultaneous PostGIS containers and port/CID isolation
        if: matrix.node-version == '24.14.0'
        shell: bash
        run: |
          set -euo pipefail
          # The normal Actions service is already running. Start two MORE DBs
          # simultaneously on this very host to cover the cross-run port race.
          containers=()
          cleanup() {
            local cid
            for cid in "${containers[@]}"; do
              docker rm -f "$cid" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT
          test -n "$ARGUS_POSTGIS_CID"
          test -n "$PGPORT"
          for label in a b; do
            cid="$(docker run -d --rm -P \
              --label "maker-mt74=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$label" \
              -e POSTGRES_USER=argus -e POSTGRES_PASSWORD=argus \
              -e POSTGRES_DB=argus_test postgis/postgis:16-3.4)"
            test -n "$cid"
            containers+=("$cid")
          done
          test "${containers[0]}" != "${containers[1]}"
          test "${containers[0]}" != "$ARGUS_POSTGIS_CID"
          test "${containers[1]}" != "$ARGUS_POSTGIS_CID"
          ports=("$PGPORT")
          for cid in "${containers[@]}"; do
            actual_image="$(docker inspect --format '{{.Config.Image}}' "$cid")"
            test "$actual_image" = "postgis/postgis:16-3.4"
            port="$(docker port "$cid" 5432/tcp | head -1 | sed -E 's/.*:([0-9]+)$/\1/')"
            [[ "$port" =~ ^[0-9]+$ ]]
            [[ "$port" -gt 0 ]]
            for prior in "${ports[@]}"; do
              if [ "$port" = "$prior" ]; then
                echo "::error::MT74 shared host port across isolated containers"
                exit 1
              fi
            done
            ports+=("$port")
          done
          # The entrypoint's temporary init server accepts Unix sockets only.
          # TCP readiness therefore waits until all PostGIS init scripts finish.
          all_containers=("$ARGUS_POSTGIS_CID" "${containers[@]}")
          for index in "${!all_containers[@]}"; do
            cid="${all_containers[$index]}"
            ready=0
            for attempt in $(seq 1 60); do
              if docker exec "$cid" psql -h 127.0.0.1 -U argus -d argus_test \
                -v ON_ERROR_STOP=1 -tAc 'SELECT postgis_full_version()' >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::MT74 private PostGIS container not ready"
              exit 1
            fi
            docker exec -i "$cid" psql -h 127.0.0.1 -U argus -d argus_test \
              -v ON_ERROR_STOP=1 < db/argus_world/001_world_memory.sql >/dev/null
            docker exec -i "$cid" psql -h 127.0.0.1 -U argus -d argus_test \
              -v ON_ERROR_STOP=1 < db/argus_world/001_world_memory_test.sql >/dev/null
            table_count="$(docker exec "$cid" psql -U argus -d argus_test \
              -v ON_ERROR_STOP=1 -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='argus_world'")"
            [[ "$table_count" =~ ^[0-9]+$ ]]
            test "$table_count" -eq 13
            echo "MT74_MIGRATION_PASS cid=$cid host_port=${ports[$index]} tables=$table_count geometry_time_provenance_supersession=pass"
          done
          for cid in "${all_containers[@]}"; do
            test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true
            echo "MT74_CONCURRENT_RUNNING cid=$cid"
          done
          # Restore the service's clean schema for the unchanged migration gates.
          docker exec "$ARGUS_POSTGIS_CID" psql -U argus -d argus_test \
            -v ON_ERROR_STOP=1 -c 'DROP SCHEMA argus_world CASCADE;' >/dev/null
          for cid in "${containers[@]}"; do
            docker rm -f "$cid" >/dev/null
            if docker inspect "$cid" >/dev/null 2>&1; then
              echo "::error::MT74 temporary container was not removed: $cid"
              exit 1
            fi
            echo "MT74_TEMP_CONTAINER_REMOVED cid=$cid"
          done
          test "$(docker inspect -f '{{.State.Running}}' "$ARGUS_POSTGIS_CID")" = true
          echo "MT74_SERVICE_PRESERVED cid=$ARGUS_POSTGIS_CID host_port=$PGPORT"
          echo "MT74_CONCURRENT_POSTGIS_PORT_AND_CONTAINER_ISOLATION_PASS"

      - name: Apply migration on clean database
        shell: bash
        run: docker exec -i "$ARGUS_POSTGIS_CID" psql -U argus -d argus_test -v ON_ERROR_STOP=1 < db/argus_world/001_world_memory.sql

      - name: Verify geometry time provenance and supersession
        shell: bash
        run: docker exec -i "$ARGUS_POSTGIS_CID" psql -U argus -d argus_test -v ON_ERROR_STOP=1 < db/argus_world/001_world_memory_test.sql

      - name: Reset ARGUS schema
        shell: bash
        run: docker exec "$ARGUS_POSTGIS_CID" psql -U argus -d argus_test -v ON_ERROR_STOP=1 -c "DROP SCHEMA argus_world CASCADE;"

      - name: Reapply migration after reset
        shell: bash
        run: docker exec -i "$ARGUS_POSTGIS_CID" psql -U argus -d argus_test -v ON_ERROR_STOP=1 < db/argus_world/001_world_memory.sql

      - name: Re-run migration gate
        shell: bash
        run: docker exec -i "$ARGUS_POSTGIS_CID" psql -U argus -d argus_test -v ON_ERROR_STOP=1 < db/argus_world/001_world_memory_test.sql

      - name: Stage libatomic for Node 26
        if: matrix.node-version == '26'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/libatomic-node26"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          apt-get download libatomic1
          pkg="$(find . -maxdepth 1 -name 'libatomic1_*.deb' -print -quit)"
          test -n "$pkg"
          dpkg-deb -x "$pkg" root
          libdir="$(dirname "$(find "$work/root" -name 'libatomic.so.1' -print -quit)")"
          test -f "$libdir/libatomic.so.1"
          echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Use Node.js for repository integration
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install pinned PostgreSQL test driver
        shell: bash
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/argus-pg-driver"
          npm install --prefix "$driver" --no-save --package-lock=false pg@8.16.3
          ln -s "$driver/node_modules/pg" node_modules/pg

      - name: Run Postgres repository contract suite
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:${{ job.services.postgis.ports[5432] }}/argus_test
        run: node --test src/argus/memory/postgresRepository.test.mjs

      - name: Run temporal and spatial World Memory query gate
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:${{ job.services.postgis.ports[5432] }}/argus_test
        run: node --test src/argus/memory/worldMemoryQuery.postgres.test.mjs

      - name: Run external provider contract suite
        run: node --test src/argus/externalProviderIngest.test.mjs

      - name: Run fusion reliability contract and labeled benchmark
        run: node --test src/argus/multiSourceFusion.test.mjs

      - name: Run multi-source fusion PostGIS and real USGS plus MBTA gate
        if: matrix.node-version == '26'
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:${{ job.services.postgis.ports[5432] }}/argus_test
        run: node --test src/argus/multiSourceFusion.postgres.test.mjs

      - name: Run AIS FIRMS Space recovery contract suite
        run: node --test src/argus/capabilityRecoveryD2.test.mjs

      - name: Run CCTV Transit Radio recovery contract suite
        run: node --test src/argus/capabilityRecoveryG.test.mjs

      - name: Run G PostGIS and public MBTA E2E gate
        if: matrix.node-version == '26'
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:${{ job.services.postgis.ports[5432] }}/argus_test
        run: node --test src/argus/recoveryG.postgres.test.mjs

      - name: Run live USGS to PostGIS E2E gate
        if: matrix.node-version == '26'
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:${{ job.services.postgis.ports[5432] }}/argus_test
        run: node --test src/argus/externalProviderIngest.postgres.test.mjs

      - name: Run USGS PostGIS restart readback into actual Cesium map entities
        if: matrix.node-version == '26'
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:${{ job.services.postgis.ports[5432] }}/argus_test
        run: node --test src/layers/earthquakes/worldMemorySource.postgres.test.mjs

      - name: Run offline CelesTrak cache and provider policy contracts
        run: node --test src/argus/celestrakReliability.test.mjs

      - name: Run offline CelesTrak PostGIS reconnect and NEXUS contract
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:${{ job.services.postgis.ports[5432] }}/argus_test
        run: node --test src/argus/celestrakPersistence.postgres.test.mjs

      - name: Run public CelesTrak to PostGIS NEXUS E2E gate
        if: matrix.node-version == '26'
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:${{ job.services.postgis.ports[5432] }}/argus_test
          ARGUS_CELESTRAK_CACHE_DIR: ${{ runner.tool_cache }}/argus-celestrak-policy-v1
          NODE_USE_ENV_PROXY: '1'
        run: node --test src/argus/celestrakPublic.postgres.test.mjs

      - name: Run ARGUS to NEXUS verified-query E2E gate
        if: matrix.node-version == '26'
        env:
          ARGUS_POSTGRES_TEST_URL: postgresql://argus:argus@127.0.0.1:${{ job.services.postgis.ports[5432] }}/argus_test
        run: node --test src/argus/nexusVerifiedQuery.postgres.test.mjs

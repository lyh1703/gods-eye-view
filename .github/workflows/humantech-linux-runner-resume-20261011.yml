name: Maker Team HumanTech Linux Runner Targeted Resume 2026-10-11
on:
  push:
    branches: ['ops/runner-readonly-diagnostic-20261009']
    paths: ['.github/workflows/humantech-linux-runner-resume-20261011.yml']
permissions: {}
concurrency:
  group: maker-team-humantech-single-listener-resume
  cancel-in-progress: false
jobs:
  resume:
    name: Resume verified stopped HumanTech Linux listener only
    runs-on: [self-hosted, windows, x64, maker-team]
    timeout-minutes: 5
    steps:
      - name: Idempotent HumanTech-only listener resume and readback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output 'RESUME_SCOPE=AdaptiveTwin-HumanTech-Research_ONLY;NO_OTHER_RUNNERS;NO_GIT_CHANGES;NO_SECRETS'
          $script = @'
          set -eu
          dir="/home/yunho/maker-runners/AdaptiveTwin-HumanTech-Research"
          is_listening() {
            for pid in $(pgrep -f 'Runner.Listener' || true); do
              [ -d "/proc/$pid" ] || continue
              cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)
              [ "$cwd" = "$dir" ] && return 0
            done
            return 1
          }
          if [ ! -d "$dir" ] || [ ! -f "$dir/.runner" ] || [ ! -x "$dir/run.sh" ]; then
            echo 'HUMANTECH_RESUME=BLOCKED_INCOMPLETE_EXISTING_INSTALL'
            exit 21
          fi
          if is_listening; then
            echo 'HUMANTECH_RESUME=ALREADY_RUNNING'
          else
            logfile="$dir/runner-resume-20261011.log"
            (cd "$dir"; nohup ./run.sh </dev/null >"$logfile" 2>&1 &)
            echo 'HUMANTECH_RESUME=START_REQUESTED'
          fi
          sleep 12
          if is_listening; then
            echo 'HUMANTECH_LISTENER=RUNNING'
          else
            echo 'HUMANTECH_LISTENER=NOT_RUNNING'
            exit 30
          fi
          '@
          $script = $script.Replace("`r`n","`n")
          & wsl.exe --distribution Ubuntu-24.04 --user yunho --exec bash -lc $script
          if ($LASTEXITCODE -ne 0) { throw ('HUMANTECH_TARGETED_RESUME_FAILED_EXIT=' + $LASTEXITCODE) }

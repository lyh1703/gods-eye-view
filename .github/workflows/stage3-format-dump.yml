name: Stage3 Format Dump

on:
  push:
    branches:
      - automation/stage3-rf-geoint-poc

jobs:
  format-dump:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Format and print Stage 3 files
        shell: bash
        run: |
          npm run format
          echo '===RUViewCSI-BEGIN==='
          cat src/sources/ruviewCsi.js
          echo '===RUViewCSI-END==='
          echo '===GeoCLIP-BEGIN==='
          cat src/geoint/geoclipAdapter.js
          echo '===GeoCLIP-END==='

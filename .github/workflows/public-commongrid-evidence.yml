name: Public CommonGrid source evidence

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'scripts/probe-commongrid-public.mjs'
      - 'src/data/commonGridEvidence.js'
      - '.github/workflows/public-commongrid-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: [self-hosted, linux, x64, maker-team]
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Probe pinned actual public US power-grid data (read-only)
        run: node scripts/probe-commongrid-public.mjs

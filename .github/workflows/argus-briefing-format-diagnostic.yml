name: ARGUS Briefing Format Diagnostic
on:
  push:
    branches:
      - feature/argus-verified-usgs-readable-briefing-20261025
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/prettier --write src/argus/publicUsgsBriefing.js
          echo ARGUS_FORMATTED_BASE64_BEGIN
          base64 -w0 src/argus/publicUsgsBriefing.js
          echo
          echo ARGUS_FORMATTED_BASE64_END

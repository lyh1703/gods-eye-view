name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: [self-hosted, linux, x64, maker-team]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Stage libatomic for Node 26
        if: startsWith(matrix.node, '26')
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/libatomic-node26"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          apt-get download libatomic1
          pkg="$(find . -maxdepth 1 -name 'libatomic1_*.deb' -print -quit)"
          test -n "$pkg"
          dpkg-deb -x "$pkg" root
          libdir="$(dirname "$(find "$work/root" -name 'libatomic.so.1' -print -quit)")"
          test -f "$libdir/libatomic.so.1"
          echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  windows-onboarding:
    name: Windows onboarding
    runs-on: [self-hosted, windows, x64, maker-team]
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Run the Pinokio install path
        run: node scripts/pinokio-install.mjs

      - name: Check adopted formatting
        run: npm run format:check

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Run focused onboarding tests
        run: node --test src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/keySetupHardening.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs

      - name: Build production bundle
        run: npm run build
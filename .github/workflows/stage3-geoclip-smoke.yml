name: Stage3 GeoCLIP Runtime Smoke

on:
  push:
    branches:
      - automation/stage3-rf-geoint-poc

jobs:
  geoclip-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install GeoCLIP
        run: python -m pip install --disable-pip-version-check geoclip
      - name: Run real GeoCLIP inference on packaged Kauai sample
        shell: bash
        run: |
          IMAGE_PATH="$(python -c "import pathlib, geoclip; print(pathlib.Path(geoclip.__file__).resolve().parent / 'images' / 'Kauai.png')")"
          test -f "$IMAGE_PATH"
          python scripts/geoclip-poc.py "$IMAGE_PATH" --top-k 3

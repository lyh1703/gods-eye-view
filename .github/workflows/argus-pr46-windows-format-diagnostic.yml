name: ARGUS PR46 Windows format diagnostic (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/argus-pr46-windows-format-diagnostic.yml'
permissions:
  contents: read
jobs:
  formatting:
    if: github.repository == 'lyh1703/gods-eye-view' && github.event.pull_request.number == 46
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install formatting dependency without running install hooks
        run: npm ci --ignore-scripts
      - name: Check source place helpers
        run: npx --no-install prettier --check src/argus/personalPlaces.js
      - name: Check storage module
        run: npx --no-install prettier --check scripts/personal-places-storage.mjs
      - name: Check CLI module
        run: npx --no-install prettier --check scripts/personal-places.mjs
      - name: Check existing adopted formatting scope
        run: npm run format:check

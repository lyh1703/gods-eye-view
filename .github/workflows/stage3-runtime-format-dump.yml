name: Stage3 Runtime Format Dump

on:
  push:
    branches:
      - automation/stage3-rf-geoint-poc

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Format and print runtime event adapter
        shell: bash
        run: |
          npm run format
          echo '===RUNTIME-BEGIN==='
          cat src/sources/ruviewRuntimeEvent.js
          echo '===RUNTIME-END==='

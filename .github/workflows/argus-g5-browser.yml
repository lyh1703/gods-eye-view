name: ARGUS G5 Browser Render Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ['argus/main']
    paths:
      - 'qa/argus-g5-browser.html'
      - 'scripts/qa-argus-g5-browser.mjs'
      - 'src/layers/earthquakes/**'
      - '.github/workflows/argus-g5-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cesium-browser:
    runs-on: [self-hosted, linux, x64, maker-team]
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install locked dependencies and compatible headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/argus-g5-puppeteer"
          rm -rf "$cache"
          mkdir -p "$cache"
          export PUPPETEER_CACHE_DIR="$cache"
          export PUPPETEER_SKIP_DOWNLOAD=1
          npm ci
          unset PUPPETEER_SKIP_DOWNLOAD
          browser_path="$(npx --no-install puppeteer browsers install chrome-headless-shell --format '{{path}}' | tail -n 1)"
          test -x "$browser_path"
          echo "PUPPETEER_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          echo "Using headless Chrome: $browser_path"

      - name: Prove real Chromium Cesium WebGL and visible provenance labels
        run: node scripts/qa-argus-g5-browser.mjs

      - name: Save browser render screenshot on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: argus-g5-browser-render
          path: qa-shots/argus-g5/
          if-no-files-found: ignore

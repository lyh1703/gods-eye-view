name: ARGUS G5 Browser Render Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: ['argus/main']
    paths:
      - 'qa/argus-g5-browser.html'
      - 'scripts/qa-argus-g5-browser.mjs'
      - 'src/layers/earthquakes/**'
      - '.github/workflows/argus-g5-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cesium-browser:
    runs-on: [self-hosted, linux, x64, maker-team]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build isolated Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="argus-g5-browser:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --pull -t "$IMAGE" - <<'DOCKERFILE'
          FROM node:24-bookworm
          RUN apt-get update \
              && apt-get install -y --no-install-recommends chromium ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /work
          ENV PUPPETEER_SKIP_DOWNLOAD=1
          ENV PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
          DOCKERFILE
          echo "ARGUS_G5_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Prove real Chromium Cesium WebGL and visible provenance labels
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --shm-size=1g \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/npm-cache \
            -e PUPPETEER_SKIP_DOWNLOAD=1 \
            -e PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$ARGUS_G5_IMAGE" \
            sh -lc 'npm ci && node scripts/qa-argus-g5-browser.mjs'

      - name: Save browser render screenshot on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: argus-g5-browser-render
          path: qa-shots/argus-g5/
          if-no-files-found: ignore

      - name: Cleanup browser runtime
        if: always()
        shell: bash
        run: docker image rm -f "${ARGUS_G5_IMAGE:-}" >/dev/null 2>&1 || true
